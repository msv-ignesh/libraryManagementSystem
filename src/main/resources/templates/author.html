<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Authors Management</title>

    <link rel="stylesheet"
          th:href="@{/style.css}">

</head>

<body>

<div class="container">

    <!-- GO BACK -->

    <a href="/" class="back-btn">
        ← Go Back
    </a>


    <h1>Authors Management</h1>


    <a href="/authors-ui/new"
       class="btn">

        + Add New Author

    </a>


    <table>

        <thead>

        <tr>

            <th>ID</th>

            <th>Name</th>

            <th>Country</th>

            <th>No of books</th>

            <th>Actions</th>

        </tr>

        </thead>


        <tbody>

        <tr th:each="author : ${authors}">

            <td th:text="${author.id}">
                1
            </td>


            <td th:text="${author.name}">
                James Gosling
            </td>


            <td th:text="${author.country}">
                USA
            </td>


            <!-- NUMBER OF BOOKS -->

            <td th:text="${bookCounts[author.id]}">
                0
            </td>


            <!-- ACTIONS -->

            <td>

                <a class="edit"
                   th:href="@{/authors-ui/edit/{id}(id=${author.id})}">
                    Edit
                </a>


                <a class="delete"
                   th:href="@{/authors-ui/delete/{id}(id=${author.id})}"
                   onclick="return confirm('Are you sure you want to delete this author?')">

                    Delete

                </a>

            </td>

        </tr>

        </tbody>

    </table>


    <p th:if="${#lists.isEmpty(authors)}">

        No authors available.

    </p>


    <!-- DELETE ERROR -->

    <script th:if="${param.deleteError}">

        alert("you cannot delete this author");

    </script>

</div>

</body>

</html>
