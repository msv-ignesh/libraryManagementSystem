<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Member - Library Management System</title>

    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    <h1>Edit Member</h1>

    <form th:action="@{/members-ui/update/{id}(id=${member.id})}"
          th:object="${member}"
          method="post">

        <div class="form-group">

            <label>Name</label>

            <input type="text"
                   th:field="*{name}"
                   placeholder="Enter member name"
                   required>

        </div>


        <div class="form-group">

            <label>Email</label>

            <input type="email"
                   th:field="*{email}"
                   placeholder="Enter email"
                   required>

        </div>


        <div class="form-group">

            <label>Phone</label>

            <input type="number"
                   th:field="*{phone}"
                   placeholder="Enter phone number"
                   required>

        </div>


        <button type="submit" class="btn">
            Update Member
        </button>

        <a href="/members-ui" class="cancel">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
